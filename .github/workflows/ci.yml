# Type check, build and test on every push and pull request.
#
# The suite is self-contained: it transpiles the sources itself, drives the host API
# through fake requests, and runs the browser bundle in a VM. The one test that needs
# a second disk volume reports itself as skipped where there is only one, so a runner
# with a single filesystem still passes honestly rather than silently.
name: verify

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Both lines the manifest accepts, so an `engines` change cannot slip in
        # unnoticed.
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Verify
        run: npm run verify
